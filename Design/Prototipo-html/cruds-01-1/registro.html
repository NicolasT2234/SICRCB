<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./ASSETS/css/styles.css">
</head>

<body>
    <div class="titulo">
        <h1>REGISTRO DE USUARIOS</h1>
    </div>

    <form class="formulario">

        <div class="campo">
            <h2>TIPO DE DOCUMENTO</h2>
            <select name="TD" id="tipo-documento" required>
                <option selected>Seleccione un tipo de documento</option>
                <option>Cédula de ciudadanía</option>
                <option>Cédula de extranjería</option>
                <option>Número de seguro social</option>
            </select>
        </div>

        <div class="campo">
            <h2>NUMERO DE DOCUMENTO</h2>
            <div class="input-wrapper">
                <input type="number" placeholder="Ingrese el Numero de Documento" name="text" class="input" required>
            </div>
        </div>

        <div class="campos-dobles">
            <div class="campo">
                <h2>NOMBRES</h2>
                <div class="input-wrapper">
                    <input type="text" placeholder="Digite sus nombres" name="nombres" required>
                </div>
            </div>
            <div class="campo">
                <h2>APELLIDOS</h2>
                <div class="input-wrapper">
                    <input type="text" placeholder="Digite sus apellidos" name="apellidos" required>
                </div>
            </div>
        </div>

        <div class="campo">
            <h2>CORREO ELECTRONICO</h2>
            <div class="input-wrapper">
                <input type="email" placeholder="ejemplo@correo.com" name="correo" required> 
            </div>
        </div>

        <div class="campo">
            <h2>NUMERO CELULAR</h2>
            <div class="input-wrapper">
                <input type="tel" placeholder="+57 123 456 7890" name="celular" required>
            </div>
        </div>

        <div class="contenedor">
            <button type="submit">
                <a href="multas.html" style="text-decoration: none; color: #fff;">
                Enviar
                </a>
                <div class="arrow-wrapper">
                    <div class="arrow"></div>
                </div>
                
            </button>
        </div>
        <div class="iniciar-sesion">
            <h6>¿Ya tienes una cuenta? <a href="iniciar-sesion.html" class="link">Inicia Sesion Aqui</a></h6>
        </div>
            
    </form>

    

    </div>

</body>

</html>
