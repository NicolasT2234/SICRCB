<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alquiler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./ASSETS/css/alquiler.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="ASSETS/img/Logo_SICRCB.png" alt="Logo" width="30" height="24">
      </a>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="multas.html">Multas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="noticias.html">Noticias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="alquiler.html" aria-current="page">Alquiler</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="abrirModal('cerrarSesion')">Cerrar Sesion</a>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  
  <h1>ALQUILER</h1>

  
  <div class="subtitulo">
    <span class="subtitulo-banda">Salón Comunal y Sillas</span>
  </div>

  
  <div class="grid-noticias">

    
    <div class="a-noticia">
      <legend>Nueva Reserva</legend>
      <hr>
      <label class="form-label">Nombre del solicitante</label>
      <input type="text" placeholder="Ej: Juan Pérez" class="input" />
      <hr>
      <label class="form-label">Tipo de alquiler</label>
      <select class="input">
        <option value="">Seleccionar...</option>
        <option value="salon">Salón Comunal</option>
        <option value="sillas">Sillas</option>
        <option value="ambos">Salón + Sillas</option>
      </select>
      <hr>
      <label class="form-label">Cantidad de sillas</label>
      <input type="number" placeholder="Ej: 20" min="1" class="input" />
      <hr>
      <label class="form-label">Fecha y hora de inicio</label>
      <input type="datetime-local" class="input" />
      <hr>
      <label class="form-label">Fecha y hora de fin</label>
      <input type="datetime-local" class="input" />
      <hr>
      <button type="button" class="btn-success" onclick="alert('Reserva creada correctamente')">Reservar</button>
      <p><i>La reserva genera un ID al ser registrada</i></p>
    </div>

    
    <div class="a-noticia">
      <h6>¿Deseas buscar una reserva?</h6>
      <hr>
      <label class="form-label">ID de la reserva</label>
      <input type="text" placeholder="#12345" class="input" />
      <hr>
      <label class="form-label">O buscar por fecha</label>
      <input type="date" class="input" />
      <hr>
      <button type="button" onclick="alert('Buscando reserva...')">Buscar</button>
    </div>

    
    <div class="a-noticia">
      <h6>¿Deseas actualizar una reserva?</h6>
      <hr>
      <div class="radio-group">
        <label class="container"> Si
          <input name="opcion1" type="radio">
          <div class="checkmark"></div>
        </label>
        <label class="container"> No
          <input name="opcion1" checked type="radio">
          <div class="checkmark"></div>
        </label>
      </div>
      <hr>
      <label class="form-label">ID de la reserva</label>
      <input type="text" placeholder="#12345" class="input" />
      <hr>
      <label class="form-label">Nuevo tipo de alquiler</label>
      <select class="input">
        <option value="">Seleccionar...</option>
        <option value="salon">Salón Comunal</option>
        <option value="sillas">Sillas</option>
        <option value="ambos">Salón + Sillas</option>
      </select>
      <hr>
      <label class="form-label">Nueva fecha y hora de inicio</label>
      <input type="datetime-local" class="input" />
      <hr>
      <label class="form-label">Nueva fecha y hora de fin</label>
      <input type="datetime-local" class="input" />
      <hr>
      <button type="button" class="btn-success" onclick="abrirModal('actualizar')">Actualizar</button>
    </div>

    
    <div class="a-noticia">
      <h6>¿Deseas eliminar una reserva?</h6>
      <hr>
      <div class="radio-group">
        <label class="container"> Si
          <input name="opcion2" type="radio">
          <div class="checkmark"></div>
        </label>
        <label class="container"> No
          <input name="opcion2" checked type="radio">
          <div class="checkmark"></div>
        </label>
      </div>
      <hr>
      <label class="form-label">ID de la reserva</label>
      <input type="text" placeholder="#12345" class="input" />
      <hr>
      <button type="button" class="btn-danger" onclick="abrirModal('eliminar')">Eliminar</button>
    </div>

  </div>

  
  <div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; justify-content:center; align-items:center;">
    <div class="card">
      <div class="header">
        <div class="image">
          <svg aria-hidden="true" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" fill="none">
            <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" stroke-linejoin="round" stroke-linecap="round"></path>
          </svg>
        </div>
        <div class="content">
          <span class="title" id="modalTitle"></span>
          <p class="message" id="modalMessage"></p>
        </div>
        <div class="actions">
          <button class="desactivate" id="modalConfirm" type="button"></button>
          <button class="cancel" type="button" onclick="cerrarModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const modalConfig = {
      actualizar: {
        title: 'Actualizar reserva',
        message: '¿Estás seguro de que deseas actualizar esta reserva? Esta acción modificará el registro permanentemente.',
        confirmText: 'Actualizar',
        onConfirm: () => { cerrarModal(); alert('Reserva actualizada correctamente'); }
      },
      eliminar: {
        title: 'Eliminar reserva',
        message: '¿Estás seguro de que deseas eliminar esta reserva? Todos los datos serán eliminados permanentemente. Esta acción no se puede deshacer.',
        confirmText: 'Eliminar',
        onConfirm: () => { cerrarModal(); alert('Reserva eliminada'); }
      },
      cerrarSesion: {
        title: 'Cerrar sesión',
        message: '¿Estás seguro de que deseas cerrar sesión?',
        confirmText: 'Cerrar sesión',
        onConfirm: () => { cerrarModal(); window.location.href = 'iniciar-sesion.html'; }
    }
    };

    function abrirModal(tipo) {
      const c = modalConfig[tipo];
      document.getElementById('modalTitle').textContent = c.title;
      document.getElementById('modalMessage').textContent = c.message;
      const btn = document.getElementById('modalConfirm');
      btn.textContent = c.confirmText;
      btn.onclick = c.onConfirm;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }
  </script>

</body>

</html>
