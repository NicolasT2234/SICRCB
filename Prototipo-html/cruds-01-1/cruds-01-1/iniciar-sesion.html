<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./ASSETS/css/styles.css">
</head>

<body>

    <div class="titulo">
        <h1>INICIO DE SESION</h1>
    </div>

    <form class="formulario">


        <div class="campo">
            <h2>CORREO</h2>
            <div class="input-wrapper">
                <input type="CORREO" placeholder="Ingrese el correo" name="text" class="input" required>
            </div>
        </div>
        <div class="campo">
            <h2>CONTRASEÑA</h2>
            <div class="input-wrapper">
                <input type="password" placeholder="Digite su contraseña " name="celular" required>

            </div>
        </div>

        <div class="contenedor">
            <button type="submit">
                 <a href="multas.html" style="text-decoration: none; color: #fff;">
                Enviar
                </a>
                <div class="arrow-wrapper">
                    <div class="arrow"></div>
                </div>
            </button>
        </div>
        <div class="iniciar-sesion" style="margin: 0 21% !important;">
            <h6>¿Aún no tienes una cuenta? <a href="registro.html" class="link">Registrate Aqui</a></h6>
        </div>

    </form>



    </div>

</body>

</html>
